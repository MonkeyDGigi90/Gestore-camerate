<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caserma T.Testero</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e5b47">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#edf0ec;--card:#fff;--tx:#17231d;--tx2:#5b6861;--bd:#d3d9d3;--ac:#2e5b47;--on:#fff;--ok:#ddefe2;--okt:#1e6a35;--wa:#f8ebc9;--wat:#7a5300;--ko:#f6dad6;--kot:#9a2a22}
@media (prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1b2520;--tx:#e8efea;--tx2:#9aa8a0;--bd:#2c3932;--ac:#7fc3a0;--on:#0f1a14;--ok:#1f3a29;--okt:#8fd6a4;--wa:#43371a;--wat:#efc96b;--ko:#45231f;--kot:#f0a79f}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 12px 32px}
h1{font-size:18px;margin:0;font-weight:600}
.t{font-weight:600;margin:0 0 2px}.s{font-size:12px;color:var(--tx2);margin:4px 0}
.row{display:flex;gap:6px;align-items:center}.row>*{min-width:0}
nav{display:flex;gap:6px;margin:10px 0}nav button{flex:1}
button,select,input,textarea{font:inherit;color:var(--tx)}
button,.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;min-height:44px;cursor:pointer;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center}
input[type=file]{display:none}
button.on,button.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin:4px 0;min-height:44px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cell{border:0;text-align:center;padding:8px 4px}.cell b{display:block;font-size:17px}.cell small{font-size:11px}
.ok{background:var(--ok);color:var(--okt)}.wa{background:var(--wa);color:var(--wat)}.ko{background:var(--ko);color:var(--kot)}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.warn{background:var(--wa);color:var(--wat);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.th{width:64px;height:64px;object-fit:cover;border-radius:8px}
video{width:100%;border-radius:8px;margin:6px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<div id="app"></div>
<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var TIPI=['Letto','Armadio','Scrivania','Comodino','Scarpiera','Sedia','Lampada','Altro'],CONDS=['buono','usurato','da sostituire'],CATS=['Idraulico','Elettrico','Riscaldamento','Infissi','Altro'],PRIO=['bassa','media','urgente'],STATI=['agibile','in manutenzione','non idonea'];
var VOCI=['Letti rifatti','Armadi e scarpiere in ordine','Scrivanie e comodini sgombri','Pavimento pulito','Bagno pulito','Cestini svuotati','Finestre e tende in ordine'];
var VER='13',K='camerate_v1',S=null;
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
var V={tab:'cam',piano:2,sel:null,edit:null,msg:'',warn:false,c:{},pend:[],pendS:[],f:{g_data:today(),edata:today(),tipo:'Letto',n_ala:'Levante',n_cap:'8',g_cat:'Idraulico',g_prio:'media',ecat:'Idraulico',econd:'buono'}};
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.camere){S={camere:[],arredi:[],segn:[],ctrl:[],bk:0};for(var p=2;p<=4;p++)for(var i=1;i<=12;i++)S.camere.push({n:p*100+i,ala:i<=6?'Levante':'Ponente',cap:8,stato:'agibile'})}
S.ctrl=S.ctrl||[];S.inv=S.inv||[];
function save(){try{localStorage.setItem(K,JSON.stringify(S));V.warn=false}catch(e){V.warn=true}}
var DB=null;
function idb(){return new Promise(function(res,rej){if(DB)return res(DB);var r=indexedDB.open('camerate',1);r.onupgradeneeded=function(){r.result.createObjectStore('p',{keyPath:'k'})};r.onsuccess=function(){DB=r.result;res(DB)};r.onerror=function(){rej(r.error)}})}
function pAll(){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction('p').objectStore('p').getAll();q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}).catch(function(){return[]})}
function pOp(fn,mode){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('p','readwrite');fn(t.objectStore('p'));t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function shrink(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.7))};im.onerror=rej;im.src=u})}
var cams=function(){return S.camere.map(function(c){return c.n}).sort(function(a,b){return a-b})};
var TIPI_L=['Camerata','Magazzino','Ufficio','Bagno','Altro'];
var pn=function(p){return p===1?'Terra':p+'° piano'};
var pianiList=function(){var a=[1,2,3,4];S.camere.forEach(function(c){var p=Math.floor(c.n/100);if(a.indexOf(p)<0)a.push(p)});return a.sort(function(x,y){return x-y})};
var tl=function(c){return (c.tipo==='Altro'&&c.nome)?c.nome:(c.tipo||'Camerata')};
var cellLabels=function(c){var l1=(c.tipo&&c.tipo!=='Camerata')?tl(c):'',l2=(c.nome&&c.nome!==l1)?c.nome:'',st='display:block;overflow-wrap:anywhere';return (l1?'<small style="'+st+'">'+esc(l1)+'</small>':'')+(l2?'<small style="'+st+';font-weight:600">'+esc(l2)+'</small>':'')};
var loc=function(n){var c=S.camere.find(function(x){return x.n==n});return (c?tl(c):'Camerata')+' '+n};
var openS=function(n){return S.segn.filter(function(s){return s.camera==n&&s.stato!=='chiusa'})};
var stc=function(c){return c.stato==='non idonea'?'ko':(openS(c.n).length?'wa':'ok')};
var opt=function(a,v){return a.map(function(o){return '<option'+(String(o)===String(v)?' selected':'')+'>'+o+'</option>'}).join('')};
var inp=function(k,ph,t){return '<input data-f="'+k+'" type="'+(t||'text')+'" placeholder="'+ph+'" value="'+esc(V.f[k])+'">'};
var dt=function(t){return new Date(t).toLocaleDateString('it-IT')};
var fd=function(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
var msg=function(){return V.msg?'<p class="s">'+esc(V.msg)+'</p>':''};
var foto=function(r){return '<div class="ph" data-ref="'+esc(r)+'"></div><label class="btn">Aggiungi foto<input type="file" accept="image/*" capture="environment" data-photo="'+esc(r)+'"></label>'};
function thumbs(){pAll().then(function(all){document.querySelectorAll('.ph').forEach(function(el){var r=el.dataset.ref;var l=r==='new'?V.pend.map(function(d,i){return{k:'n'+i,d:d}}):r==='newseg'?V.pendS.map(function(d,i){return{k:'q'+i,d:d}}):all.filter(function(o){return o.r===r});el.innerHTML=l.map(function(o){return '<span><img class="th" src="'+o.d+'" alt="Foto"><button data-a="delfoto" data-v="'+o.k+'" aria-label="Elimina foto" style="min-height:0;padding:0 6px">x</button></span>'}).join('')})})}

function segItem(s){var c=s.stato==='chiusa';return '<div class="li"><div><b>'+esc(s.cat)+'</b> · '+s.prio+'<p class="s">'+loc(s.camera)+(s.arredo?', arredo '+esc(s.arredo):'')+' · '+(s.ril?'rilevato il '+fd(s.ril):dt(s.ts))+' · '+s.stato+(vecchia(s)?' · <b style="color:var(--wat)">da oltre '+cfg().seg+' giorni</b>':'')+'</p><p style="margin:0">'+esc(s.desc)+'</p>'+foto('s:'+s.id)+'</div><button data-a="'+(c?'riapri':'chiudi')+'" data-v="'+s.id+'">'+(c?'Riapri':'Chiudi')+'</button></div>'}

function camView(){
 if(V.inv)return invView();
 if(V.sel!=null){var c=S.camere.find(function(x){return x.n==V.sel});if(c)return detail(c)}
 var h=summary()+'<div class="row">'+pianiList().map(function(p){return '<button style="flex:1" class="'+(V.piano==p?'on':'')+'" data-a="piano" data-v="'+p+'">'+pn(p)+'</button>'}).join('')+'</div><div class="cols">';
 ['Levante','Ponente'].forEach(function(a){
  h+='<div><p class="s">Ala '+a+'</p><div class="g">'+S.camere.filter(function(c){return Math.floor(c.n/100)==V.piano&&c.ala===a}).sort(function(x,y){return x.n-y.n}).map(function(c){var o=openS(c.n).length;return '<button class="cell '+stc(c)+'"'+(scad(c)?' style="box-shadow:inset 0 0 0 2px var(--wat)"':'')+' data-a="sel" data-v="'+c.n+'"><b>'+c.n+'</b><small>'+(c.stato==='non idonea'?'non idonea':o?o+(o>1?' aperte':' aperta'):'agibile')+'</small>'+cellLabels(c)+(scad(c)?'<small style="display:block">'+(lastCtrl(c.n)?'controllo scaduto':'mai controllata')+'</small>':'')+'</button>'}).join('')+'</div></div>'});
 h+='</div><p class="s">Verde: agibile. Giallo: segnalazioni aperte. Rosso: non idonea. Bordo giallo: controllo da fare.</p>';
 h+='<div class="card"><p class="t">Aggiungi camerata o locale</p><div class="row"><select data-f="n_tipo">'+opt(TIPI_L,V.f.n_tipo)+'</select>'+inp('n_num','Numero','number')+'</div><div class="row"><select data-f="n_ala">'+opt(['Levante','Ponente'],V.f.n_ala)+'</select>'+inp('n_cap','Posti (solo camerate)','number')+'</div>'+inp('n_nome','Nome (con Altro: scrivi cosa è, es. Bar)')+'<button data-a="addcam">Aggiungi</button>'+msg()+'</div>';
 return h}

function detail(c){
 var isC=(c.tipo||'Camerata')==='Camerata';
 var li=S.inv.filter(function(x){return x.camera==c.n}).sort(function(a,b){return b.ts-a.ts})[0];
 var A=S.arredi.filter(function(a){return a.camera==c.n&&!a.dismesso});
 var lc=S.ctrl.filter(function(x){return x.camera==c.n}).sort(function(a,b){return b.ts-a.ts})[0];
 var n=Object.keys(V.c).length;
 return '<button data-a="back">Torna alla griglia</button><div class="card"><p class="t">'+esc(tl(c))+' '+c.n+(c.nome&&tl(c)!==c.nome?' · '+esc(c.nome):'')+'</p><p class="s">Ala '+c.ala+', '+pn(Math.floor(c.n/100))+(isC?', '+c.cap+' posti':'')+'</p><select data-st="'+c.n+'">'+opt(STATI,c.stato)+'</select><div class="row"><button class="pri" data-a="toseg" data-v="'+c.n+'">Segnala guasto</button><button data-a="toarr" data-v="'+c.n+'">Aggiungi arredo</button></div><div class="row" style="margin-top:8px"><button data-a="inv" style="flex:1">Inventario</button><button data-a="editcam" style="flex:1">'+(V.ecam===c.n?'Chiudi modifica':'Modifica dati')+'</button></div></div>'+(V.ecam===c.n?'<div class="card"><p class="t">Modifica</p><label class="s">Uso del locale</label><select data-f="m_tipo">'+opt(TIPI_L,V.f.m_tipo)+'</select><label class="s">Nome (con Altro è il testo mostrato)</label>'+inp('m_nome','Nome')+'<label class="s">Ala</label><select data-f="m_ala">'+opt(['Levante','Ponente'],V.f.m_ala)+'</select>'+(V.f.m_tipo==='Camerata'?'<label class="s">Posti letto</label>'+inp('m_cap','Posti','number'):'')+'<button class="pri" data-a="savecam" style="margin-top:8px">Salva modifiche</button>'+(V.mmod?'<p class="s">'+esc(V.mmod)+'</p>':'')+'</div>':'')
 +(isC?'<div class="card"><p class="t">Ordine e pulizia</p><p class="s">'+(lc?'Ultimo controllo: '+dt(lc.ts)+', '+(lc.ko?lc.ko+' da correggere':'conforme'):'Nessun controllo eseguito.')+'</p>'
 +VOCI.map(function(v,i){var s=V.c[i];return '<div class="li" style="display:block"><div class="row"><span style="flex:1">'+v+'</span><button class="'+(s==='ok'?'on':'')+'" data-a="cv" data-v="'+i+'|ok">Ok</button><button class="'+(s==='ko'?'on':'')+'" data-a="cv" data-v="'+i+'|ko">Da correggere</button></div>'+(s==='ko'?inp('cn'+i,'Nota'):'')+'</div>'}).join('')
 +'<p class="s">'+n+' di '+VOCI.length+' controllate</p><button class="pri" data-a="savec">Salva controllo</button>'+msg()+'</div>':'')
 +'<div class="card"><p class="t">Segnalazioni aperte</p>'+(openS(c.n).map(segItem).join('')||'<p class="s">Nessuna segnalazione aperta.</p>')+'</div><div class="card"><p class="t">Arredi ('+A.length+')</p>'+(li?'<p class="s">Ultimo inventario: '+dt(li.ts)+', '+li.tro+' trovati su '+li.att+(li.man?', '+li.man+' mancanti':'')+'</p>':'')+(A.map(function(a){return '<div class="li"><span>'+a.tipo+' '+esc(a.qr)+'</span><span class="s">'+a.cond+'</span></div>'}).join('')||'<p class="s">Nessun arredo censito.</p>')+'</div><div class="card"><p class="t">Elimina '+esc(tl(c).toLowerCase())+'</p><p class="s">Si può eliminare solo se non ha arredi in uso né segnalazioni aperte. Vengono eliminati anche i dati collegati ormai chiusi (arredi dismessi, segnalazioni chiuse, controlli, foto).</p><button data-a="delcam" style="color:var(--kot)">Elimina '+tl(c).toLowerCase()+' '+c.n+'</button>'+(V.mdel?'<p class="s">'+esc(V.mdel)+'</p>':'')+'</div>'}

function arrView(){
 var q=(V.f.q||'').toLowerCase();
 var L=S.arredi.filter(function(a){return !q||[a.qr,a.sn,a.desc,a.tipo,a.camera].join(' ').toLowerCase().indexOf(q)>=0});
 var h='<div class="card"><p class="t">Censimento</p><label class="s">Ubicazione</label><select data-f="camera">'+opt(cams(),V.f.camera)+'</select><label class="s">Codice QR</label><div class="row">'+inp('qr','Scansiona o digita')+'<button data-a="scan">Scansiona</button></div><video id="vid" hidden playsinline muted></video><label class="s">Tipo</label><select data-f="tipo">'+opt(TIPI,V.f.tipo)+'</select><label class="s">Numero di serie</label>'+inp('sn','Numero di serie')+'<label class="s">Descrizione</label>'+inp('desc','Descrizione')+'<p class="s">Foto del dettaglio (massimo 3)</p>'+foto('new')+'<div><button class="pri" data-a="addarr" style="margin-top:8px">Salva arredo</button></div>'+msg()+'</div>';
 h+='<p class="s">'+S.arredi.filter(function(a){return !a.dismesso}).length+' arredi in uso</p>'+inp('q','Cerca codice, serie, camerata');
 var LA=L.filter(function(a){return !a.dismesso}),LD=L.filter(function(a){return a.dismesso});
 var row=function(a){
  var g=S.segn.filter(function(s){return s.arredo===a.qr}),ga=g.filter(function(s){return s.stato!=='chiusa'}).length;
  var r='<div class="li"><div><b>'+a.tipo+'</b> '+esc(a.qr)+(a.dismesso?' (dismesso)':'')+'<p class="s">'+loc(a.camera)+' · '+esc(a.sn)+' · '+a.cond+(ga?' · '+ga+(ga>1?' guasti aperti':' guasto aperto'):'')+'</p></div><button data-a="edit" data-v="'+esc(a.qr)+'">'+(V.edit===a.qr?'Chiudi':'Apri')+'</button></div>';
  if(V.edit===a.qr)r+='<div class="card"><p class="s">'+esc(a.desc)+'</p>'+foto('a:'+a.qr)+'<label class="s">Ubicazione</label><select data-f="ecamera">'+opt(cams(),V.f.ecamera)+'</select><label class="s">Condizione</label><select data-f="econd">'+opt(CONDS,V.f.econd)+'</select><div class="row"><button class="pri" data-a="saveedit">Salva</button><button data-a="dismetti">'+(a.dismesso?'Ripristina':'Dismetti')+'</button></div><p class="t" style="margin-top:12px">Guasti dell\'arredo</p>'+(g.map(function(s){return '<p class="s">'+esc(s.cat)+' · '+s.stato+(s.ril?' · rilevato il '+fd(s.ril):'')+': '+esc(s.desc)+'</p>'}).join('')||'<p class="s">Nessun guasto.</p>')+'<select data-f="ecat">'+opt(CATS,V.f.ecat)+'</select>'+inp('edesc','Descrizione del guasto')+'<label class="s">Data di rilevazione</label>'+inp('edata','','date')+'<p class="s">Foto del guasto (massimo 3)</p>'+foto('newseg')+'<div><button data-a="segarr" style="margin-top:8px">Segnala guasto</button></div></div>';
  return r};
 h+=LA.map(row).join('')||'<p class="s">Nessun arredo in uso.</p>';
 h+='<div class="card"><div class="row"><span class="t" style="flex:1">Dismessi ('+LD.length+')</span><button data-a="showd">'+(V.showD?'Nascondi':'Mostra')+'</button></div>'+(V.showD?(LD.map(function(a){return '<div class="li"><div><b>'+a.tipo+'</b> '+esc(a.qr)+'<p class="s">'+loc(a.camera)+' · '+esc(a.sn)+'</p></div><div class="row"><button data-a="ripr" data-v="'+esc(a.qr)+'">Ripristina</button><button data-a="elim" data-v="'+esc(a.qr)+'" style="color:var(--kot)">Elimina</button></div></div>'}).join('')||'<p class="s">Nessun arredo dismesso.</p>'):'')+'</div>';
 return h}

function segView(){
 var L=S.segn.slice().sort(function(a,b){return (a.stato==='chiusa')-(b.stato==='chiusa')||b.ts-a.ts});
 return '<div class="card"><p class="t">Nuova segnalazione</p><label class="s">Ubicazione</label><select data-f="g_camera">'+opt(cams(),V.f.g_camera)+'</select><label class="s">Codice arredo (facoltativo)</label>'+inp('g_arredo','Codice QR')+'<label class="s">Categoria</label><select data-f="g_cat">'+opt(CATS,V.f.g_cat)+'</select><label class="s">Priorità</label><select data-f="g_prio">'+opt(PRIO,V.f.g_prio)+'</select><label class="s">Descrizione</label><textarea data-f="g_desc" rows="2">'+esc(V.f.g_desc)+'</textarea><label class="s">Data di rilevazione</label>'+inp('g_data','','date')+'<p class="s">Foto del guasto (massimo 3)</p>'+foto('newseg')+'<div><button class="pri" data-a="addseg" style="margin-top:8px">Salva segnalazione</button></div>'+msg()+'</div>'+(L.map(segItem).join('')||'<p class="s">Nessuna segnalazione.</p>')}

function datiView(){
 return msg()+'<div class="card"><p class="t">Backup e trasferimento</p><p class="s">Ultimo backup: '+(S.bk?dt(S.bk):'mai')+'. I dati e le foto sono solo su questo dispositivo: senza backup, se il browser viene svuotato o il dispositivo si perde, si perdono.</p><button class="pri" data-a="exp">Esporta backup</button><p class="s">Per passare dal telefono al tablet: esporta qui, copia il file sul tablet e importalo.</p><label class="btn">Importa backup<input type="file" accept=".json,application/json" data-imp="1"></label></div><div class="card"><p class="t">Esporta in Excel</p><p class="s">File .xlsx con tre fogli: Locali, Arredi, Segnalazioni. Le foto non sono incluse.</p><button class="pri" data-a="expx">Esporta in Excel</button></div><div class="card"><p class="t">Soglie di scadenza</p><label class="s">Controllo camerata: da fare dopo (giorni)</label><input type="number" data-f="cfg_ctrl" value="'+cfg().ctrl+'"><label class="s">Segnalazione aperta: evidenzia dopo (giorni)</label><input type="number" data-f="cfg_seg" value="'+cfg().seg+'"></div><div class="card"><p class="s">'+S.camere.length+' locali, '+S.arredi.length+' arredi, '+S.segn.length+' segnalazioni. Versione app: '+VER+'.</p></div>'}

function render(){
 var old=!S.bk||Date.now()-S.bk>7*864e5;
 var h='<h1>Caserma “T.Testero”</h1>';
 if(V.warn)h+='<div class="warn">Salvataggio locale non riuscito: esporta subito i dati dalla scheda Dati.</div>';
 else if(old)h+='<div class="warn">Backup: '+(S.bk?'più di 7 giorni fa':'mai eseguito')+'. Vai in Dati.</div>';
 h+='<nav>'+[['cam','Ed. Storico'],['arr','Arredi'],['seg','Segnalazioni'],['dat','Dati']].map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" class="'+(V.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</nav>';
 if(!V.f.camera)V.f.camera=String(cams()[0]||'');
 if(!V.f.g_camera)V.f.g_camera=String(cams()[0]||'');
 h+=V.tab==='cam'?camView():V.tab==='arr'?arrView():V.tab==='seg'?segView():datiView();
 $('#app').innerHTML=h;thumbs();reattach()}

async function scan(){
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices){V.msg='La scansione non è disponibile qui. Digita il codice.';return render()}
 try{var stm=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});

 else if(a==='invadd'){invAdd(V.f.inv_code);V.f.inv_code=''}
 else if(a==='invmove'){x=S.arredi.find(function(y){return y.qr===v});if(x&&V.inv){x.st=x.st||[];x.st.push({d:now,da:x.camera,a:V.inv.n});x.camera=V.inv.n;V.inv.found.push(v);V.inv.ex=V.inv.ex.filter(function(e){return e.qr!==v});save();V.imsg='Spostato qui: '+v}}
 else if(a==='invseg'){x=S.arredi.find(function(y){return y.qr===v});if(x&&V.inv){S.segn.push({id:now,camera:V.inv.n,arredo:v,cat:'Altro',prio:'media',desc:'Arredo mancante in inventario',stato:'aperta',ts:now,ril:today()});V.inv.sig.push(v);save()}}
 else if(a==='invend'){stopInv();var I=V.inv,E2=S.arredi.filter(function(y){return y.camera==I.n&&!y.dismesso}),mm=E2.filter(function(y){return I.found.indexOf(y.qr)<0}).length;S.inv.push({camera:I.n,ts:now,att:E2.length,tro:I.found.length,man:mm,ex:I.ex.length});save();V.inv=null}
 else if(a==='invexit'){stopInv();V.inv=null}
 else if(a==='showd')V.showD=!V.showD;
 else if(a==='ripr'){x=S.arredi.find(function(y){return y.qr===v});if(x){x.dismesso=false;save()}}
 else if(a==='elim'){if(confirm('Eliminare definitivamente questo arredo e le sue foto? Non si può annullare. Le segnalazioni collegate restano.')){S.arredi=S.arredi.filter(function(y){return y.qr!==v});save();V.msg='Arredo eliminato.';pAll().then(function(all){var ks=all.filter(function(o){return o.r==='a:'+v}).map(function(o){return o.k});return pOp(function(st){ks.forEach(function(k){st.delete(k)})})}).then(render)}}
 else if(a==='dismetti'){x=S.arredi.find(function(y){return y.qr===V.edit});if(x){x.dismesso=!x.dismesso;save();V.edit=null}}
 else if(a==='segarr'){x=S.arredi.find(function(y){return y.qr===V.edit});if(x){S.segn.push({id:now,camera:x.camera,arredo:x.qr,cat:V.f.ecat,prio:'media',desc:V.f.edesc||'',stato:'aperta',ts:now,ril:V.f.edata||today()});savePh(now);V.f.edesc='';V.f.edata=today();save();V.msg='Guasto segnalato.'}}
 else if(a==='addseg'){if(!V.f.g_camera)V.msg='Scegli la camerata.';else{S.segn.push({id:now,camera:+V.f.g_camera,arredo:(V.f.g_arredo||'').trim(),cat:V.f.g_cat,prio:V.f.g_prio,desc:V.f.g_desc||'',stato:'aperta',ts:now,ril:V.f.g_data||today()});savePh(now);V.f.g_desc='';V.f.g_arredo='';V.f.g_data=today();V.msg='Segnalazione salvata.';save()}}
 render()}

var app=$('#app');
app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
app.addEventListener('input',function(e){var t=e.target;if(t.dataset.f)V.f[t.dataset.f]=t.value});
app.addEventListener('change',function(e){var t=e.target;
 if(t.dataset.photo){var r=t.dataset.photo,f=t.files[0];if(!f)return;
  pAll().then(function(all){var pl=r==='new'?V.pend:r==='newseg'?V.pendS:null;var n=pl?pl.length:all.filter(function(o){return o.r===r}).length;if(n>=3){V.msg='Massimo 3 foto.';return render()}
   return shrink(f).then(function(d){if(pl){pl.push(d);render()}else return pOp(function(st){st.put({k:r+'|'+Date.now(),r:r,d:d})}).then(render)})}).catch(function(){V.msg='Foto non salvata.';render()})}
 else if(t.dataset.imp){if(t.files[0])imp(t.files[0])}
 else if(t.dataset.st){var c=S.camere.find(function(x){return x.n==t.dataset.st});if(c){c.stato=t.value;save();render()}}
 else if(t.dataset.f==='q'){V.f.q=t.value;render()}
 else if(t.dataset.f==='m_tipo'){V.f.m_tipo=t.value;render()}
 else if(t.dataset.f==='cfg_ctrl'){cfg().ctrl=Math.max(1,+t.value||30);save();render()}
 else if(t.dataset.f==='cfg_seg'){cfg().seg=Math.max(1,+t.value||14);save();render()}});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
