<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infrastrutture</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#14213a;--tx2:#5a6679;--bd:#dde3ec;--soft:#e4e9f2;--ac:#1f3a5f;--on:#fff;--acc:#b8893b;--ok:#dff1e6;--okt:#16683a;--okb:#3fae6c;--wa:#fbefcf;--wat:#7d5600;--wab:#e0a526;--ko:#f9dedb;--kot:#a02a22;--kob:#dc5a4f;--sh:0 1px 2px rgba(20,33,58,.06),0 8px 22px rgba(20,33,58,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1523;--card:#152238;--tx:#e8eefa;--tx2:#9aa9c2;--bd:#23334f;--soft:#1c2c47;--ac:#8db4e8;--on:#0d1523;--acc:#e0b96a;--ok:#16382a;--okt:#8fd9a8;--wa:#40351a;--wat:#f0cd78;--ko:#432522;--kot:#f4aaa2;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25)}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:680px;margin:0 auto;padding:12px 12px 90px}
h1{display:flex;align-items:center;gap:12px;font-size:19px;margin:0 0 4px;font-weight:700;letter-spacing:.2px;padding:16px 18px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#1f3a5f,#2d5588)}
h1::before{content:"";width:5px;height:28px;border-radius:3px;background:#d9ad5a;flex:none}
.t{font-weight:650;font-size:16px;margin:0 0 4px}.s{font-size:12.5px;color:var(--tx2);margin:4px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}
nav{display:flex;gap:4px;margin:12px 0;background:var(--soft);padding:4px;border-radius:16px}
nav button{flex:1;background:transparent;border:0;border-radius:12px;min-height:42px;font-weight:600;color:var(--tx2)}
nav button.on{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button,.btn{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer;box-sizing:border-box;font-weight:550;transition:transform .08s}
button:active,.btn:active{transform:scale(.97)}
.btn{display:inline-flex;align-items:center;justify-content:center}
input[type=file]{display:none}
button.on,button.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin:4px 0;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{border:0;border-radius:14px;text-align:center;padding:10px 4px;min-height:0}
.cell b{display:block;font-size:20px;font-weight:700}.cell small{font-size:11.5px}
.ok{background:var(--ok);color:var(--okt)}.wa{background:var(--wa);color:var(--wat)}.ko{background:var(--ko);color:var(--kot)}
button.cell.ok{box-shadow:inset 0 -4px 0 var(--okb)}button.cell.wa{box-shadow:inset 0 -4px 0 var(--wab)}button.cell.ko{box-shadow:inset 0 -4px 0 var(--kob)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.warn{background:var(--wa);color:var(--wat);border-radius:14px;padding:10px 14px;font-size:13px;margin:10px 0;border-left:4px solid var(--wab)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.th{width:68px;height:68px;object-fit:cover;border-radius:12px;border:1px solid var(--bd)}
video{width:100%;border-radius:14px;margin:8px 0;background:#000}
button.cell.sel{outline:2px solid var(--ac);outline-offset:2px}
.fab{position:fixed;right:16px;bottom:16px;z-index:40;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.28);padding:12px 20px;background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:650}
.scan{position:fixed;top:0;right:0;bottom:0;left:0;background:#0b0f16;z-index:60;padding:12px;overflow:auto}
.scan video{width:100%;max-height:50vh;object-fit:cover;border-radius:12px;margin:8px 0}
.scan input[type=range]{padding:0;min-height:36px}

.th{cursor:zoom-in}
.zoom{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.zoom img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:8px}
.zoom .zb{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}

.rt{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0 14px}
.rt th,.rt td{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}
.rt th{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.rep h2{font-size:17px;margin:0 0 2px}.rep h3{font-size:14px;margin:14px 0 2px}
#pv{display:none}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr)}
.lbl{display:flex;align-items:center;gap:3mm;border:.2mm dashed #999;padding:3mm;height:30mm;box-sizing:border-box;break-inside:avoid;color:#000;background:#fff}
.lq svg{width:22mm;height:22mm;display:block}.lt b{font-size:13pt;display:block;word-break:break-all}.lt span{font-size:8pt;display:block}
@media print{@page{margin:10mm}body{background:#fff;color:#000}#app{display:none!important}#pv{display:block}#pv .rt{font-size:10pt}#pv .rt th,#pv .rt td{border-bottom:1px solid #999;color:#000}#pv .s{color:#333}}

nav button{font-size:13px;padding:8px 4px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<div id="app"></div><div id="pv"></div>
<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var TIPI=['Letto','Armadio','Scrivania','Comodino','Scarpiera','Sedia','Lampada','Altro'],CONDS=['buono','usurato','da sostituire'],CATS=['Idraulico','Elettrico','Riscaldamento','Infissi','Altro'],PRIO=['bassa','media','urgente'],STATI=['agibile','in manutenzione','non idonea'];
var VOCI=['Letti rifatti','Armadi e scarpiere in ordine','Scrivanie e comodini sgombri','Pavimento pulito','Bagno pulito','Cestini svuotati','Finestre e tende in ordine'];
var VER='22',K='camerate_v1',S=null;
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
var V={tab:'cam',piano:'2° piano',sel:null,edit:null,msg:'',warn:false,c:{},pend:[],pendS:[],pendC:[],f:{rep_m:today().slice(0,7),gg_cat:'Idraulico',gg_prio:'media',giro_scope:'Tutte le camerate',g_data:today(),edata:today(),tipo:'Letto',n_ala:'Levante',n_cap:'8',g_cat:'Idraulico',g_prio:'media',ecat:'Idraulico',econd:'buono'}};
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.camere){S={camere:[],arredi:[],segn:[],ctrl:[],bk:0};for(var p=2;p<=4;p++)for(var i=1;i<=12;i++)S.camere.push({n:p*100+i,ala:i<=6?'Levante':'Ponente',cap:8,stato:'agibile'})}
S.ctrl=S.ctrl||[];S.inv=S.inv||[];S.trash=S.trash||[];
function save(){try{localStorage.setItem(K,JSON.stringify(S));V.warn=false}catch(e){V.warn=true}}
var DB=null;
function idb(){return new Promise(function(res,rej){if(DB)return res(DB);var r=indexedDB.open('camerate',1);r.onupgradeneeded=function(){r.result.createObjectStore('p',{keyPath:'k'})};r.onsuccess=function(){DB=r.result;res(DB)};r.onerror=function(){rej(r.error)}})}
function pAll(){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction('p').objectStore('p').getAll();q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}).catch(function(){return[]})}
function pOp(fn,mode){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('p','readwrite');fn(t.objectStore('p'));t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function shrink(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.7))};im.onerror=rej;im.src=u})}
var cams=function(){return S.camere.map(function(c){return c.n}).sort(function(a,b){return a-b})};
var TIPI_L=['Camerata','Magazzino','Ufficio','Bagno','Altro'];
var pn=function(p){return p===1?'Terra':p+'° piano'};
var autoPiano=function(n){var p=Math.floor(n/100);return p===0?'Autorimessa':pn(p)};
var pianoOf=function(c){return c.piano||autoPiano(c.n)};
var pianoN=function(n){var c=S.camere.find(function(x){return x.n==n});return c?pianoOf(c):autoPiano(n)};
var pianiList=function(){var a=(S.piani||[]).slice();S.camere.forEach(function(c){var p=pianoOf(c);if(a.indexOf(p)<0)a.push(p)});return a};
function fixPiani(){S.piani=S.piani||['Autorimessa','Terra','Primo piano','2° piano','3° piano','4° piano','Tetto'];S.camere.forEach(function(c){if(!c.piano)c.piano=autoPiano(c.n)});S.piani=pianiList()}
fixPiani();
var tl=function(c){return (c.tipo==='Altro'&&c.nome)?c.nome:(c.tipo||'Camerata')};
var cellLabels=function(c){var l1=(c.tipo&&c.tipo!=='Camerata')?tl(c):'',l2=(c.nome&&c.nome!==l1)?c.nome:'',st='display:block;overflow-wrap:anywhere';return (l1?'<small style="'+st+'">'+esc(l1)+'</small>':'')+(l2?'<small style="'+st+';font-weight:600">'+esc(l2)+'</small>':'')};
var loc=function(n){var c=S.camere.find(function(x){return x.n==n});return (c?tl(c):'Camerata')+' '+n};
var openS=function(n){return S.segn.filter(function(s){return s.camera==n&&s.stato!=='chiusa'})};
var stc=function(c){return c.stato==='non idonea'?'ko':(openS(c.n).length?'wa':'ok')};
var opt=function(a,v){return a.map(function(o){return '<option'+(String(o)===String(v)?' selected':'')+'>'+o+'</option>'}).join('')};
var inp=function(k,ph,t){return '<input data-f="'+k+'" type="'+(t||'text')+'" placeholder="'+ph+'" value="'+esc(V.f[k])+'">'};
var dt=function(t){return new Date(t).toLocaleDateString('it-IT')};
var fd=function(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
var msg=function(){return V.msg?'<p class="s">'+esc(V.msg)+'</p>':''};
var foto=function(r){return '<div class="ph" data-ref="'+esc(r)+'"></div><label class="btn">Aggiungi foto<input type="file" accept="image/*" capture="environment" data-photo="'+esc(r)+'"></label>'};
function thumbs(){pAll().then(function(all){ZL=[];document.querySelectorAll('.ph').forEach(function(el){var r=el.dataset.ref;var l=r==='new'?V.pend.map(function(d,i){return{k:'n'+i,d:d}}):r==='newseg'?V.pendS.map(function(d,i){return{k:'q'+i,d:d}}):r==='newcl'?V.pendC.map(function(d,i){return{k:'k'+i,d:d}}):all.filter(function(o){return o.r===r&&!o.del});var dl=l.map(function(o){return o.d});el.innerHTML=l.map(function(o,ix){ZL.push({l:dl,i:ix});return '<span><img class="th" data-a="zoom" data-v="'+(ZL.length-1)+'" src="'+o.d+'" alt="Foto"><button data-a="delfoto" data-v="'+o.k+'" aria-label="Elimina foto" style="min-height:0;padding:0 6px">x</button></span>'}).join('')})})}

function segItem(s){var c=s.stato==='chiusa';return '<div class="li"><div><b>'+esc(s.cat)+'</b> · '+s.prio+'<p class="s">'+loc(s.camera)+(s.arredo?', arredo '+esc(s.arredo):'')+' · '+(s.ril?'rilevato il '+fd(s.ril):dt(s.ts))+' · '+s.stato+(vecchia(s)?' · <b style="color:var(--wat)">da oltre '+cfg().seg+' giorni</b>':'')+'</p><p style="margin:0">'+esc(s.desc)+'</p>'+foto('s:'+s.id)+(s.cl?'<p class="s" style="margin:4px 0 0">Chiusa il '+dt(s.cl.d)+(s.cl.nota?': '+esc(s.cl.nota):'')+'</p><div class="ph" data-ref="c:'+s.id+'"></div>':'')+'</div><div style="display:flex;flex-direction:column;gap:6px"><button data-a="'+(c?'riapri':'chiudi')+'" data-v="'+s.id+'">'+(c?'Riapri':(V.cl===s.id?'Annulla':'Chiudi'))+'</button><button data-a="editsg" data-v="'+s.id+'">'+(V.es===s.id?'Annulla':'Modifica')+'</button></div></div>'+(V.es===s.id?segEdit(s):'')+(V.cl===s.id?segClose(s):'')}

function camView(){
 if(V.giro)return giroView();
 if(V.inv)return invView();
 if(V.sel!=null){var c=S.camere.find(function(x){return x.n==V.sel});if(c)return detail(c)}
 if(pianiList().indexOf(V.piano)<0)V.piano=pianiList()[0];
 var h=summary()+giroStartCard()+'<div class="row" style="flex-wrap:wrap">'+pianiList().map(function(p){return '<button style="flex:1 1 auto" class="'+(V.piano===p?'on':'')+'" data-a="piano" data-v="'+esc(p)+'">'+esc(p)+'</button>'}).join('')+'</div><div class="cols">';
 ['Levante','Ponente'].forEach(function(a){
  h+='<div><p class="s">Ala '+a+'</p><div class="g">'+S.camere.filter(function(c){return pianoOf(c)===V.piano&&c.ala===a}).sort(function(x,y){return x.n-y.n}).map(function(c){var o=openS(c.n).length;return '<button class="cell '+stc(c)+'"'+(scad(c)?' style="outline:2px dashed var(--wat);outline-offset:-5px"':'')+' data-a="sel" data-v="'+c.n+'"><b>'+c.n+'</b><small>'+(c.stato==='non idonea'?'non idonea':o?o+(o>1?' aperte':' aperta'):'agibile')+'</small>'+cellLabels(c)+(scad(c)?'<small style="display:block">'+(lastCtrl(c.n)?'controllo scaduto':'mai controllata')+'</small>':'')+'</button>'}).join('')+'</div></div>'});
 h+='</div><p class="s">Verde: agibile. Giallo: segnalazioni aperte. Rosso: non idonea. Bordo giallo: controllo da fare.</p>';
 h+='<div class="card"><p class="t">Aggiungi camerata o locale</p><div class="row"><select data-f="n_tipo">'+opt(TIPI_L,V.f.n_tipo)+'</select>'+inp('n_num','Numero','number')+'</div>'+inp('n_fine','Fino al numero (facoltativo, per più locali in serie)','number')+'<label class="s">Piano</label><select data-f="n_piano">'+opt(['Automatico'].concat(pianiList()),V.f.n_piano||'Automatico')+'</select><div class="row"><select data-f="n_ala">'+opt(['Levante','Ponente'],V.f.n_ala)+'</select>'+inp('n_cap','Posti (solo camerate)','number')+'</div>'+inp('n_nome','Nome (con Altro: scrivi cosa è, es. Bar)')+'<button data-a="addcam">Aggiungi</button>'+msg()+'</div>';
 return h}

function detail(c){
 var isC=(c.tipo||'Camerata')==='Camerata';
 var li=S.inv.filter(function(x){return x.camera==c.n}).sort(function(a,b){return b.ts-a.ts})[0];
 var A=S.arredi.filter(function(a){return a.camera==c.n&&!a.dismesso});
 var lc=S.ctrl.filter(function(x){return x.camera==c.n}).sort(function(a,b){return b.ts-a.ts})[0];
 var n=Object.keys(V.c).length;
 return '<button data-a="back">Torna alla griglia</button><div class="card"><p class="t">'+esc(tl(c))+' '+c.n+(c.nome&&tl(c)!==c.nome?' · '+esc(c.nome):'')+'</p><p class="s">Ala '+c.ala+', '+pianoOf(c)+(isC?', '+c.cap+' posti':'')+'</p><select data-st="'+c.n+'">'+opt(STATI,c.stato)+'</select><div class="row"><button class="pri" data-a="toseg" data-v="'+c.n+'">Segnala guasto</button><button data-a="toarr" data-v="'+c.n+'">Aggiungi arredo</button></div><div class="row" style="margin-top:8px"><button data-a="inv" style="flex:1">Inventario</button><button data-a="editcam" style="flex:1">'+(V.ecam===c.n?'Chiudi modifica':'Modifica dati')+'</button></div></div>'+(V.ecam===c.n?'<div class="card"><p class="t">Modifica</p><label class="s">Numero</label>'+inp('m_num','Numero','number')+'<label class="s">Piano</label><select data-f="m_piano">'+opt(pianiList(),V.f.m_piano)+'</select><label class="s">Uso del locale</label><select data-f="m_tipo">'+opt(TIPI_L,V.f.m_tipo)+'</select><label class="s">Nome (con Altro è il testo mostrato)</label>'+inp('m_nome','Nome')+'<label class="s">Ala</label><select data-f="m_ala">'+opt(['Levante','Ponente'],V.f.m_ala)+'</select>'+(V.f.m_tipo==='Camerata'?'<label class="s">Posti letto</label>'+inp('m_cap','Posti','number'):'')+'<button class="pri" data-a="savecam" style="margin-top:8px">Salva modifiche</button>'+(V.mmod?'<p class="s">'+esc(V.mmod)+'</p>':'')+'</div>':'')
 +(isC?'<div class="card"><p class="t">Ordine e pulizia</p><p class="s">'+(lc?'Ultimo controllo: '+dt(lc.ts)+', '+(lc.ko?lc.ko+' da correggere':'conforme'):'Nessun controllo eseguito.')+'</p>'
 +VOCI.map(function(v,i){var s=V.c[i];return '<div class="li" style="display:block"><div class="row"><span style="flex:1">'+v+'</span><button class="'+(s==='ok'?'on':'')+'" data-a="cv" data-v="'+i+'|ok">Ok</button><button class="'+(s==='ko'?'on':'')+'" data-a="cv" data-v="'+i+'|ko">Da correggere</button></div>'+(s==='ko'?inp('cn'+i,'Nota'):'')+'</div>'}).join('')
 +'<p class="s">'+n+' di '+VOCI.length+' controllate</p><button class="pri" data-a="savec">Salva controllo</button>'+msg()+'</div>':'')
 +'<div class="card"><p class="t">Segnalazioni aperte</p>'+(openS(c.n).map(segItem).join('')||'<p class="s">Nessuna segnalazione aperta.</p>')+'</div><div class="card"><p class="t">Arredi ('+A.length+')</p>'+(li?'<p class="s">Ultimo inventario: '+dt(li.ts)+', '+li.tro+' trovati su '+li.att+(li.man?', '+li.man+' mancanti':'')+'</p>':'')+(A.map(function(a){return '<div class="li"><span>'+a.tipo+' '+esc(a.qr)+'</span><span class="s">'+a.cond+'</span></div>'}).join('')||'<p class="s">Nessun arredo censito.</p>')+'</div><div class="card"><p class="t">Elimina '+esc(tl(c).toLowerCase())+'</p><p class="s">Si può eliminare solo se non ha arredi in uso né segnalazioni aperte. Vengono eliminati anche i dati collegati ormai chiusi (arredi dismessi, segnalazioni chiuse, controlli, foto).</p><button data-a="delcam" style="color:var(--kot)">Elimina '+tl(c).toLowerCase()+' '+c.n+'</button>'+(V.mdel?'<p class="s">'+esc(V.mdel)+'</p>':'')+'</div>'}

function arrView(){
 var q=(V.f.q||'').toLowerCase();
 var L=S.arredi.filter(function(a){return !q||[a.qr,a.sn,a.desc,a.tipo,a.camera].join(' ').toLowerCase().indexOf(q)>=0});
 var h='<div class="card"><p class="t">Censimento</p><label class="s">Ubicazione</label><select data-f="camera">'+opt(cams(),V.f.camera)+'</select><label class="s">Codice QR</label><div class="row">'+inp('qr','Scansiona o digita')+'<button data-a="scan">Scansiona</button></div><video id="vid" hidden playsinline muted></video><label class="s">Tipo</label><select data-f="tipo">'+opt(TIPI,V.f.tipo)+'</select><label class="s">Numero di serie</label>'+inp('sn','Numero di serie')+'<label class="s">Descrizione</label>'+inp('desc','Descrizione')+'<p class="s">Foto del dettaglio (massimo 3)</p>'+foto('new')+'<div><button class="pri" data-a="addarr" style="margin-top:8px">Salva arredo</button></div>'+msg()+'</div>';
 h+='<p class="s">'+S.arredi.filter(function(a){return !a.dismesso}).length+' arredi in uso</p>'+inp('q','Cerca codice, serie, camerata');
 var LA=L.filter(function(a){return !a.dismesso}),LD=L.filter(function(a){return a.dismesso});
